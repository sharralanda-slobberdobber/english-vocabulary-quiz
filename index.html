<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语词汇小测试 - 一年级版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1CB0F6 0%, #58CC02 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            border: 2px solid #E5E5E5;
        }

        h1 {
            text-align: center;
            color: #4C4C4C;
            font-size: 1.8em;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .emoji-decoration {
            position: fixed;
            font-size: 1.8em;
            pointer-events: none;
            opacity: 0.6;
            z-index: 0;
        }

        .emoji-item {
            position: absolute;
            transform: rotate(var(--rotation));
            transition: transform 0.3s ease;
        }

        .emoji-item:hover {
            transform: rotate(0deg) scale(1.2);
        }

        .level-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .level-btn {
            padding: 12px 20px;
            font-size: 0.95em;
            border: 2px solid #E5E5E5;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            color: #4C4C4C;
            transition: all 0.2s ease;
            background: #FFFFFF;
            box-shadow: 0 4px 0 #E5E5E5;
        }

        .level-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #E5E5E5;
        }

        .level-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #E5E5E5;
        }

        .level-btn.active {
            background: #58CC02;
            color: #FFFFFF;
            border-color: #58A700;
            box-shadow: 0 4px 0 #58A700;
        }

        .level-btn.active:hover {
            box-shadow: 0 6px 0 #58A700;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }

        .mode-btn {
            padding: 12px 25px;
            font-size: 1em;
            border: 2px solid #E5E5E5;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            color: #4C4C4C;
            transition: all 0.2s ease;
            background: #FFFFFF;
            box-shadow: 0 4px 0 #E5E5E5;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #E5E5E5;
        }

        .mode-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #E5E5E5;
        }

        .mode-btn.active {
            background: #1CB0F6;
            color: #FFFFFF;
            border-color: #1899D6;
            box-shadow: 0 4px 0 #1899D6;
        }

        .mode-btn.active:hover {
            box-shadow: 0 6px 0 #1899D6;
        }

        .start-btn {
            background: #58CC02;
            color: #FFFFFF;
            border: 2px solid #58A700;
            padding: 16px 40px;
            font-size: 1.2em;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            display: block;
            margin: 20px auto;
            box-shadow: 0 4px 0 #58A700;
            transition: all 0.2s ease;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #58A700;
        }

        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #58A700;
        }

        /* Page 2 styles */
        .word-card {
            background: #F7F7F7;
            border-radius: 16px;
            padding: 25px;
            margin: 15px 0;
            text-align: center;
            border: 2px solid #E5E5E5;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .word-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #E5E5E5;
        }

        .word-card:active {
            transform: translateY(2px);
        }

        .word-text {
            font-size: 3em;
            font-weight: 800;
            color: #4C4C4C;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .word-translation {
            font-size: 1.5em;
            color: #777777;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .word-type {
            font-size: 0.9em;
            color: #777777;
            background: #E5E5E5;
            padding: 6px 15px;
            border-radius: 20px;
            display: inline-block;
            font-weight: 600;
        }

        .example-card {
            background: #F7F7F7;
            border-radius: 16px;
            padding: 25px;
            margin: 15px 0;
            text-align: center;
            border: 2px solid #E5E5E5;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .example-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #E5E5E5;
        }

        .example-card:active {
            transform: translateY(2px);
        }

        .example-text {
            font-size: 1.6em;
            color: #4C4C4C;
            font-weight: 600;
            line-height: 1.4;
        }

        .mic-btn {
            background: #FFC800;
            border: 2px solid #DEA600;
            color: #FFFFFF;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.5em;
            margin: 15px auto;
            display: block;
            transition: all 0.2s ease;
            font-weight: 700;
            box-shadow: 0 4px 0 #DEA600;
        }

        .mic-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #DEA600;
        }

        .mic-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #DEA600;
        }

        .mic-btn.recording {
            background: #FF4B4B;
            border-color: #E53939;
            box-shadow: 0 4px 0 #E53939;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .score-display {
            text-align: center;
            padding: 15px;
            border-radius: 16px;
            margin: 15px 0;
            font-size: 1.2em;
            font-weight: 700;
            display: none;
        }

        .score-display.good {
            background: #58CC02;
            color: #FFFFFF;
            border: 2px solid #58A700;
        }

        .score-display.average {
            background: #FFC800;
            color: #FFFFFF;
            border: 2px solid #DEA600;
        }

        .score-display.poor {
            background: #FF4B4B;
            color: #FFFFFF;
            border: 2px solid #E53939;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 10px 18px;
            font-size: 0.9em;
            border: 2px solid #E5E5E5;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            color: #4C4C4C;
            transition: all 0.2s ease;
            background: #FFFFFF;
            box-shadow: 0 4px 0 #E5E5E5;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #E5E5E5;
        }

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #E5E5E5;
        }

        .nav-btn.prev {
            background: #FF9600;
            color: #FFFFFF;
            border-color: #E58600;
            box-shadow: 0 4px 0 #E58600;
        }

        .nav-btn.prev:hover {
            box-shadow: 0 6px 0 #E58600;
        }

        .nav-btn.next {
            background: #58CC02;
            color: #FFFFFF;
            border-color: #58A700;
            box-shadow: 0 4px 0 #58A700;
        }

        .nav-btn.next:hover {
            box-shadow: 0 6px 0 #58A700;
        }

        .nav-btn.shuffle {
            background: #1CB0F6;
            color: #FFFFFF;
            border-color: #1899D6;
            box-shadow: 0 4px 0 #1899D6;
        }

        .nav-btn.shuffle:hover {
            box-shadow: 0 6px 0 #1899D6;
        }

        .nav-btn.back {
            background: #FF4B4B;
            color: #FFFFFF;
            border-color: #E53939;
            box-shadow: 0 4px 0 #E53939;
        }

        .nav-btn.back:hover {
            box-shadow: 0 6px 0 #E53939;
        }

        .progress {
            text-align: center;
            color: #777777;
            font-size: 0.95em;
            margin: 10px 0;
            font-weight: 600;
        }

        .progress-bar {
            background: #E5E5E5;
            height: 12px;
            border-radius: 8px;
            margin: 10px auto;
            max-width: 250px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #58CC02 0%, #1CB0F6 100%);
            height: 100%;
            transition: width 0.3s ease;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        @media (max-width: 400px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.5em;
            }

            .word-text {
                font-size: 2.5em;
            }

            .example-text {
                font-size: 1.3em;
            }

            .level-btn, .mode-btn {
                padding: 10px 15px;
                font-size: 0.85em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Page 1: Selection -->
        <div class="page active" id="page1">
            <div class="emoji-decoration" id="emojiDecoration"></div>
            <h1>英语词汇小测试</h1>
            
            <div class="level-selector">
                <button class="level-btn active" onclick="selectLevel(1)">Level 1</button>
                <button class="level-btn" onclick="selectLevel(2)">Level 2</button>
                <button class="level-btn" onclick="selectLevel(3)">Level 3</button>
            </div>

            <div class="mode-selector">
                <button class="mode-btn active" onclick="selectMode('learn')">📖 学习</button>
                <button class="mode-btn" onclick="selectMode('quiz')">🎯 测试</button>
            </div>

            <button class="start-btn" onclick="goToPage2()">开始学习 🚀</button>
        </div>

        <!-- Page 2: Learning -->
        <div class="page" id="page2">
            <div class="word-card" onclick="playWordSound()">
                <div class="word-text" id="wordText">the</div>
                <div class="word-translation" id="wordTranslation">这/那</div>
                <div class="word-type" id="wordType">article</div>
            </div>

            <div class="example-card" onclick="playExampleSound()">
                <div class="example-text" id="wordExample">The cat is black.</div>
            </div>

            <button class="mic-btn" id="micBtn" onclick="toggleRecording()">🎤 录音打分</button>

            <div class="score-display" id="scoreDisplay"></div>

            <div class="nav-buttons">
                <button class="nav-btn back" onclick="goToPage1()">⬅️ 返回</button>
                <button class="nav-btn prev" onclick="prevWord()">⬅️ 上一个</button>
                <button class="nav-btn shuffle" onclick="shuffleWords()">🔀 打乱</button>
                <button class="nav-btn next" onclick="nextWord()">下一个 ➡️</button>
            </div>

            <div class="progress">
                <div id="progressText">1 / 50</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 2%"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load word data
        let wordData = {};
        let currentLevel = 1;
        let currentMode = 'learn';
        let currentWords = [];
        let currentIndex = 0;
        let shuffled = false;
        let isRecording = false;
        let recognition = null;

        // Load words from JSON file
        async function loadWords() {
            try {
                const response = await fetch('words.json');
                wordData = await response.json();
                currentWords = wordData.level1;
            } catch (error) {
                console.error('Error loading words:', error);
                // Fallback to hardcoded words if file fails to load
                wordData = {
                    level1: [
                        {word: "the", translation: "这/那", example: "The cat is black.", type: "article"},
                        {word: "be", translation: "是", example: "I am happy.", type: "verb"},
                        {word: "to", translation: "到/向", example: "Go to school.", type: "preposition"},
                        {word: "of", translation: "的", example: "A cup of tea.", type: "preposition"},
                        {word: "and", translation: "和", example: "You and I.", type: "conjunction"}
                    ]
                };
                currentWords = wordData.level1;
            }
        }

        // Page navigation
        function goToPage1() {
            document.getElementById('page1').classList.add('active');
            document.getElementById('page2').classList.remove('active');
        }

        function goToPage2() {
            document.getElementById('page1').classList.remove('active');
            document.getElementById('page2').classList.add('active');
            updateDisplay();
        }

        // Select level
        function selectLevel(level) {
            currentLevel = level;
            document.querySelectorAll('.level-btn').forEach((btn, index) => {
                btn.classList.toggle('active', index + 1 === level);
            });
            
            const levelKey = `level${level}`;
            if (wordData[levelKey]) {
                currentWords = wordData[levelKey];
            } else {
                // Fallback to level1 if level doesn't exist yet
                currentWords = wordData.level1;
            }
            
            currentIndex = 0;
            shuffled = false;
        }

        // Select mode
        function selectMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // Update display
        function updateDisplay() {
            if (currentWords.length === 0) return;
            
            const word = currentWords[currentIndex];
            document.getElementById('wordText').textContent = word.word;
            document.getElementById('wordTranslation').textContent = word.translation;
            document.getElementById('wordExample').textContent = word.example;
            document.getElementById('wordType').textContent = word.type;
            
            const progress = ((currentIndex + 1) / currentWords.length) * 100;
            document.getElementById('progressText').textContent = `${currentIndex + 1} / ${currentWords.length}`;
            document.getElementById('progressFill').style.width = `${progress}%`;
            
            // Hide score display when changing words
            document.getElementById('scoreDisplay').style.display = 'none';
        }

        // Play word sound
        function playWordSound() {
            if ('speechSynthesis' in window) {
                const word = currentWords[currentIndex];
                const utterance = new SpeechSynthesisUtterance(word.word);
                utterance.lang = 'en-US';
                utterance.rate = 0.7;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;
                
                // Try to get English voice
                const voices = window.speechSynthesis.getVoices();
                let englishVoice = null;
                for (let voice of voices) {
                    if (voice.lang.includes('en') || voice.lang.includes('US') || voice.lang.includes('GB')) {
                        englishVoice = voice;
                        if (voice.name.includes('Google') || voice.name.includes('Microsoft')) {
                            break;
                        }
                    }
                }
                
                if (englishVoice) {
                    utterance.voice = englishVoice;
                }
                
                window.speechSynthesis.speak(utterance);
            }
        }

        // Play example sentence sound
        function playExampleSound() {
            if ('speechSynthesis' in window) {
                const word = currentWords[currentIndex];
                const utterance = new SpeechSynthesisUtterance(word.example);
                utterance.lang = 'en-US';
                utterance.rate = 0.6;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;
                
                // Try to get English voice
                const voices = window.speechSynthesis.getVoices();
                let englishVoice = null;
                for (let voice of voices) {
                    if (voice.lang.includes('en') || voice.lang.includes('US') || voice.lang.includes('GB')) {
                        englishVoice = voice;
                        if (voice.name.includes('Google') || voice.name.includes('Microsoft')) {
                            break;
                        }
                    }
                }
                
                if (englishVoice) {
                    utterance.voice = englishVoice;
                }
                
                window.speechSynthesis.speak(utterance);
            }
        }

        // Navigation
        function prevWord() {
            if (currentIndex > 0) {
                currentIndex--;
                updateDisplay();
            }
        }

        function nextWord() {
            if (currentIndex < currentWords.length - 1) {
                currentIndex++;
                updateDisplay();
            } else {
                currentIndex = 0;
                updateDisplay();
            }
        }

        // Shuffle words
        function shuffleWords() {
            for (let i = currentWords.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentWords[i], currentWords[j]] = [currentWords[j], currentWords[i]];
            }
            currentIndex = 0;
            shuffled = true;
            updateDisplay();
        }

        // Recording and pronunciation scoring
        function toggleRecording() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('您的浏览器不支持语音识别功能。请使用Chrome或Safari浏览器。');
                return;
            }

            const micBtn = document.getElementById('micBtn');
            
            if (isRecording) {
                // Stop recording
                if (recognition) {
                    recognition.stop();
                }
                isRecording = false;
                micBtn.classList.remove('recording');
                micBtn.textContent = '🎤 录音打分';
            } else {
                // Start recording
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'en-US';
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onstart = function() {
                    isRecording = true;
                    micBtn.classList.add('recording');
                    micBtn.textContent = '🔴 录音中...';
                };

                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript.toLowerCase();
                    const word = currentWords[currentIndex].word.toLowerCase();
                    const confidence = event.results[0][0].confidence;
                    
                    // Simple scoring based on similarity
                    let score = 0;
                    if (transcript === word) {
                        score = 100;
                    } else if (transcript.includes(word)) {
                        score = 80;
                    } else if (word.includes(transcript)) {
                        score = 60;
                    } else {
                        // Calculate similarity based on character overlap
                        const similarity = calculateSimilarity(transcript, word);
                        score = Math.round(similarity * 100);
                    }

                    displayScore(score);
                };

                recognition.onerror = function(event) {
                    console.error('Speech recognition error:', event.error);
                    isRecording = false;
                    micBtn.classList.remove('recording');
                    micBtn.textContent = '🎤 录音打分';
                    alert('语音识别出错，请重试。');
                };

                recognition.onend = function() {
                    isRecording = false;
                    micBtn.classList.remove('recording');
                    micBtn.textContent = '🎤 录音打分';
                };

                recognition.start();
            }
        }

        // Calculate similarity between two strings
        function calculateSimilarity(str1, str2) {
            const longer = str1.length > str2.length ? str1 : str2;
            const shorter = str1.length > str2.length ? str2 : str1;
            
            if (longer.length === 0) return 1.0;
            
            const costs = [];
            for (let i = 0; i <= longer.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= shorter.length; j++) {
                    if (i === 0) {
                        costs[j] = j;
                    } else if (j > 0) {
                        let newValue = costs[j - 1];
                        if (longer.charAt(i - 1) !== shorter.charAt(j - 1)) {
                            newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                        }
                        costs[j - 1] = lastValue;
                        lastValue = newValue;
                    }
                }
                if (i > 0) costs[shorter.length] = lastValue;
            }
            
            return 1 - costs[shorter.length] / longer.length;
        }

        // Display score
        function displayScore(score) {
            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.style.display = 'block';
            
            if (score >= 80) {
                scoreDisplay.className = 'score-display good';
                scoreDisplay.textContent = `🎉 太棒了！得分: ${score}`;
            } else if (score >= 60) {
                scoreDisplay.className = 'score-display average';
                scoreDisplay.textContent = `👍 不错！得分: ${score}`;
            } else {
                scoreDisplay.className = 'score-display poor';
                scoreDisplay.textContent = `💪 继续努力！得分: ${score}`;
            }
        }

        // Initialize
        loadWords();
        
        // Load voices when available
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // Generate emoji decoration
        function generateEmojiDecoration() {
            const emojis = [
                // Animals
                '🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵',
                '🐔', '🐧', '🐦', '🐤', '🦆', '🦅', '🦉', '🦇', '🐺', '🐗', '🐴', '🦄', '🐝', '🐛', '🦋',
                '🐌', '🐞', '🐜', '🦟', '🦗', '🕷️', '🕸️', '🦂', '🐢', '🐍', '🦎', '🦖', '🦕', '🐙', '🦑',
                '🦐', '🦞', '🦀', '🐡', '🐠', '🐟', '🐬', '🐳', '🐋', '🦈', '🐊', '🐅', '🐆', '🦓', '🦍',
                // Food
                '🍎', '🍐', '🍊', '🍋', '🍌', '🍉', '🍇', '🍓', '🫐', '🍈', '🍒', '🍑', '🥭', '🍍', '🥥',
                '🥝', '🍅', '🍆', '🥑', '🥦', '🥬', '🥒', '🌶️', '🫑', '🌽', '🥕', '🫒', '🧄', '🧅', '🥔',
                '🍠', '🥐', '🥯', '🍞', '🥖', '🥨', '🧀', '🥚', '🍳', '🧈', '🥞', '🧇', '🥓', '🥩', '🍗',
                '🍖', '🦴', '🌭', '🍔', '🍟', '🍕', '🫓', '🥪', '🥙', '🧆', '🌮', '🌯', '🫔', '🥗', '🥘',
                '🫕', '🍝', '🍜', '🍲', '🍛', '🍣', '🍱', '🥟', '🦪', '🍤', '🍙', '🍚', '🍘', '🍥', '🥠',
