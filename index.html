<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>英语词汇小测试 - 一年级版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #4A90E2 0%, #50C878 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background: #FFFFFF;
            border-radius: 30px;
            padding: 20px;
            padding-top: 60px;
            padding-bottom: 60px;
            padding-left: 40px;
            padding-right: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(74, 144, 226, 0.25);
            border: 3px solid #4A90E2;
            position: relative;
        }

        h1 {
            text-align: center;
            color: #4A90E2;
            font-size: 1.8em;
            margin-top: 50px;
            margin-bottom: 15px;
            font-weight: 800;
            text-shadow: 2px 2px 0px #FFE066;
        }

        .emoji-decoration {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            font-size: 1.8em;
            pointer-events: none;
            z-index: 0;
        }

        .emoji-item {
            position: absolute;
            transform: rotate(var(--rotation));
            transition: transform 0.3s ease;
        }

        .emoji-item:hover {
            transform: rotate(0deg) scale(1.2);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .emoji-item {
            animation: twinkle 3s ease-in-out infinite;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }

        .quiz-option-btn {
            padding: 18px;
            font-size: 1em;
            border: 3px solid #4A90E2;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 800;
            color: #4A90E2;
            transition: all 0.2s ease;
            background: #FFFFFF;
            box-shadow: 0 5px 0 #4A90E2;
        }

        .quiz-option-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #4A90E2;
            background: #E8F4FD;
        }

        .quiz-option-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #4A90E2;
        }

        .quiz-option-btn.correct {
            background: #50C878;
            color: #FFFFFF;
            border-color: #3DAF5F;
            box-shadow: 0 5px 0 #3DAF5F;
        }

        .quiz-option-btn.correct:hover {
            box-shadow: 0 8px 0 #3DAF5F;
            background: #50C878;
        }

        .quiz-option-btn.wrong {
            background: #FF9500;
            color: #FFFFFF;
            border-color: #E58600;
            box-shadow: 0 5px 0 #E58600;
            opacity: 0.9;
        }

        .quiz-option-btn.wrong:hover {
            box-shadow: 0 8px 0 #E58600;
            background: #FF9500;
        }

        .quiz-result {
            text-align: center;
            padding: 15px;
            border-radius: 16px;
            margin: 15px 0;
            font-size: 1.1em;
            font-weight: 700;
            display: none;
        }

        .quiz-result.correct {
            background: #50C878;
            color: #FFFFFF;
            border: 3px solid #3DAF5F;
        }

        .quiz-result.wrong {
            background: #FF9500;
            color: #FFFFFF;
            border: 3px solid #E58600;
        }

        .level-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .level-btn {
            padding: 12px 20px;
            font-size: 0.95em;
            border: 3px solid #4A90E2;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 800;
            color: #4A90E2;
            transition: all 0.2s ease;
            background: #FFFFFF;
            box-shadow: 0 5px 0 #4A90E2;
        }

        .level-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #4A90E2;
            background: #E8F4FD;
        }

        .level-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #4A90E2;
        }

        .level-btn.active {
            background: #50C878;
            color: #FFFFFF;
            border-color: #3DAF5F;
            box-shadow: 0 5px 0 #3DAF5F;
        }

        .level-btn.active:hover {
            box-shadow: 0 8px 0 #3DAF5F;
            background: #50C878;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }

        .mode-btn {
            padding: 12px 25px;
            font-size: 1em;
            border: 3px solid #4A90E2;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 800;
            color: #4A90E2;
            transition: all 0.2s ease;
            background: #FFFFFF;
            box-shadow: 0 5px 0 #4A90E2;
        }

        .mode-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #4A90E2;
            background: #E8F4FD;
        }

        .mode-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #4A90E2;
        }

        .mode-btn.active {
            background: #50C878;
            color: #FFFFFF;
            border-color: #3DAF5F;
            box-shadow: 0 5px 0 #3DAF5F;
        }

        .mode-btn.active:hover {
            box-shadow: 0 8px 0 #3DAF5F;
            background: #50C878;
        }

        .start-btn {
            background: #58CC02;
            color: #FFFFFF;
            border: 2px solid #58A700;
            padding: 16px 40px;
            font-size: 1.2em;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            display: block;
            margin: 20px auto;
            box-shadow: 0 4px 0 #58A700;
            transition: all 0.2s ease;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #58A700;
        }

        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #58A700;
        }

        /* Page 2 styles */
        .word-card {
            background: #E8F4FD;
            border-radius: 25px;
            padding: 25px;
            margin: 15px 0;
            text-align: center;
            border: 3px solid #4A90E2;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 0 #4A90E2;
        }

        .word-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #4A90E2;
            background: #D4EBF9;
        }

        .word-card:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #4A90E2;
        }

        .word-text {
            font-size: 3em;
            font-weight: 800;
            color: #4A90E2;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px #FFE066;
        }

        .word-translation {
            font-size: 1.5em;
            color: #4A90E2;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .word-type {
            font-size: 0.9em;
            color: #FFFFFF;
            background: #50C878;
            padding: 6px 15px;
            border-radius: 20px;
            display: inline-block;
            font-weight: 700;
            border: 2px solid #3DAF5F;
        }

        .example-card {
            background: #FFF9E6;
            border-radius: 25px;
            padding: 25px;
            margin: 15px 0;
            text-align: center;
            border: 3px solid #FFE066;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 0 #FFE066;
        }

        .example-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #FFE066;
            background: #FFF0C2;
        }

        .example-card:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #FFE066;
        }

        .example-text {
            font-size: 1.6em;
            color: #4A90E2;
            font-weight: 700;
            line-height: 1.4;
        }

        .mic-btn {
            background: #FF9500;
            border: 3px solid #E58600;
            color: #FFFFFF;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.5em;
            margin: 15px auto;
            display: block;
            transition: all 0.2s ease;
            font-weight: 800;
            box-shadow: 0 5px 0 #E58600;
        }

        .mic-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #E58600;
        }

        .mic-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #E58600;
        }

        .mic-btn.recording {
            background: #FF4B4B;
            border-color: #E53939;
            box-shadow: 0 5px 0 #E53939;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .score-display {
            text-align: center;
            padding: 15px;
            border-radius: 20px;
            margin: 15px 0;
            font-size: 1.2em;
            font-weight: 800;
            display: none;
            border: 3px solid;
        }

        .score-display.good {
            background: #50C878;
            color: #FFFFFF;
            border-color: #3DAF5F;
        }

        .score-display.average {
            background: #FFE066;
            color: #4A90E2;
            border-color: #DEA600;
        }

        .score-display.poor {
            background: #FF9500;
            color: #FFFFFF;
            border-color: #E58600;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 10px 18px;
            font-size: 0.9em;
            border: 3px solid #4A90E2;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 800;
            color: #4A90E2;
            transition: all 0.2s ease;
            background: #FFFFFF;
            box-shadow: 0 5px 0 #4A90E2;
        }

        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #4A90E2;
            background: #E8F4FD;
        }

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #4A90E2;
        }

        .nav-btn.prev {
            background: #FFE066;
            color: #4A90E2;
            border-color: #DEA600;
            box-shadow: 0 5px 0 #DEA600;
        }

        .nav-btn.prev:hover {
            box-shadow: 0 8px 0 #DEA600;
            background: #FFE066;
        }

        .nav-btn.next {
            background: #50C878;
            color: #FFFFFF;
            border-color: #3DAF5F;
            box-shadow: 0 5px 0 #3DAF5F;
        }

        .nav-btn.next:hover {
            box-shadow: 0 8px 0 #3DAF5F;
            background: #50C878;
        }

        .nav-btn.back {
            background: #FF9500;
            color: #FFFFFF;
            border-color: #E58600;
            box-shadow: 0 5px 0 #E58600;
        }

        .nav-btn.back:hover {
            box-shadow: 0 8px 0 #E58600;
            background: #FF9500;
        }

        .progress {
            text-align: center;
            color: #4A90E2;
            font-size: 0.95em;
            margin: 10px 0;
            font-weight: 700;
        }

        .progress-bar {
            background: #E8F4FD;
            height: 12px;
            border-radius: 10px;
            margin: 10px auto;
            max-width: 250px;
            overflow: hidden;
            border: 2px solid #4A90E2;
        }

        .progress-fill {
            background: linear-gradient(90deg, #50C878 0%, #4A90E2 100%);
            height: 100%;
            transition: width 0.3s ease;
        }

        .stats-container {
            background: #E8F4FD;
            border-radius: 20px;
            padding: 20px;
            margin: 15px 0;
            border: 3px solid #4A90E2;
        }

        .stats-title {
            text-align: center;
            font-size: 1.2em;
            font-weight: 800;
            color: #4A90E2;
            margin-bottom: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .stat-item {
            background: #FFFFFF;
            padding: 12px;
            border-radius: 15px;
            border: 2px solid #4A90E2;
            text-align: center;
        }

        .stat-level {
            font-size: 0.9em;
            font-weight: 700;
            color: #4A90E2;
            margin-bottom: 5px;
        }

        .stat-accuracy {
            font-size: 1.3em;
            font-weight: 800;
            color: #4A90E2;
        }

        .stat-accuracy.high {
            color: #50C878;
        }

        .stat-accuracy.medium {
            color: #FFE066;
        }

        .stat-accuracy.low {
            color: #FF9500;
        }

        .stat-words {
            font-size: 0.8em;
            color: #4A90E2;
            margin-top: 3px;
            font-weight: 600;
        }

        .vocab-estimate {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #4A90E2 0%, #50C878 100%);
            border-radius: 20px;
            margin: 15px 0;
            color: #FFFFFF;
            border: 3px solid #4A90E2;
        }

        .vocab-estimate-title {
            font-size: 1em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .vocab-estimate-value {
            font-size: 2em;
            font-weight: 800;
            text-shadow: 2px 2px 0px #FFE066;
        }

        .show-stats-btn {
            background: #FF9500;
            color: #FFFFFF;
            border: 3px solid #E58600;
            padding: 12px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 800;
            display: block;
            margin: 15px auto;
            box-shadow: 0 5px 0 #E58600;
            transition: all 0.2s ease;
        }

        .show-stats-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #E58600;
            background: #FF9500;
        }

        .show-stats-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #E58600;
        }

        .chart-container {
            background: #FFF9E6;
            border-radius: 20px;
            padding: 20px;
            margin: 15px 0;
            border: 3px solid #FFE066;
        }

        .chart-title {
            text-align: center;
            font-size: 1.1em;
            font-weight: 800;
            color: #4A90E2;
            margin-bottom: 15px;
        }

        canvas {
            width: 100%;
            height: 200px;
            display: block;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        @media (max-width: 400px) {
            .container {
                padding: 15px;
                padding-top: 50px;
                padding-bottom: 50px;
            }

            h1 {
                font-size: 1.5em;
            }

            .word-text {
                font-size: 2.5em;
            }

            .example-text {
                font-size: 1.3em;
            }

            .level-btn, .mode-btn {
                padding: 10px 15px;
                font-size: 0.85em;
            }

            .quiz-options {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .emoji-decoration {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
                padding-top: 50px;
                padding-bottom: 50px;
            }

            .quiz-options {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Touch-friendly button sizes */
        @media (hover: none) and (pointer: coarse) {
            .quiz-option-btn,
            .level-btn,
            .mode-btn,
            .nav-btn,
            .start-btn,
            .mic-btn,
            .show-stats-btn {
                min-height: 48px;
                min-width: 48px;
            }

            .word-card,
            .example-card {
                min-height: 80px;
            }
        }

        /* Prevent zoom on input focus for iOS */
        @supports (-webkit-touch-callout: none) {
            input,
            textarea,
            select {
                font-size: 16px !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Page 1: Selection -->
        <div class="page active" id="page1">
            <div class="emoji-decoration" id="emojiDecoration"></div>
            <h1>英语词汇小测试</h1>
            
            <div class="level-selector">
                <button class="level-btn active" onclick="selectLevel(1)">Level 1</button>
                <button class="level-btn" onclick="selectLevel(2)">Level 2</button>
                <button class="level-btn" onclick="selectLevel(3)">Level 3</button>
                <button class="level-btn" onclick="selectLevel(4)">Level 4</button>
                <button class="level-btn" onclick="selectLevel(5)">Level 5</button>
                <button class="level-btn" onclick="selectLevel(6)">Level 6</button>
            </div>

            <div class="mode-selector">
                <button class="mode-btn active" onclick="selectMode('learn')">📖 学习</button>
                <button class="mode-btn" onclick="selectMode('quiz')">🎯 测试</button>
            </div>

            <button class="show-stats-btn" onclick="toggleStats()">📊 查看统计</button>

            <button class="show-stats-btn" onclick="startReviewMode()" id="reviewBtn" style="display: none;">🔄 复习待复习词汇</button>

            <button class="show-stats-btn" onclick="showWrongAnswers()" id="wrongAnswersBtn" style="display: none;">📓 错题本</button>

            <div id="statsContainer" style="display: none;">
                <div class="vocab-estimate">
                    <div class="vocab-estimate-title">📈 词汇量估算</div>
                    <div class="vocab-estimate-value" id="vocabEstimate">0</div>
                </div>
                <div class="stats-container">
                    <div class="stats-title">🎯 各级别掌握情况</div>
                    <div class="stats-grid" id="statsGrid">
                        <!-- Stats will be populated by JavaScript -->
                    </div>
                </div>
                <div class="chart-container">
                    <div class="chart-title">📊 词汇量增长曲线</div>
                    <canvas id="growthChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Page 2: Learning -->
        <div class="page" id="page2">
            <!-- Learn Mode -->
            <div id="learnMode">
                <div class="word-card" onclick="playWordSound()">
                    <div class="word-text" id="wordText">the</div>
                    <div class="word-translation" id="wordTranslation">这/那</div>
                    <div class="word-type" id="wordType">article</div>
                </div>

                <div class="example-card" onclick="playExampleSound()">
                    <div class="example-text" id="wordExample">The cat is black.</div>
                </div>

                <button class="mic-btn" id="micBtn" onclick="toggleRecording()">🎤 录音打分</button>

                <div class="score-display" id="scoreDisplay"></div>

                <div class="nav-buttons">
                    <button class="nav-btn prev" onclick="prevWord()">⬅️ 上一个</button>
                    <button class="nav-btn next" onclick="nextWord()">下一个 ➡️</button>
                </div>

                <div class="nav-buttons">
                    <button class="nav-btn back" onclick="goToPage1()">⬅️ 返回目录</button>
                </div>

                <div class="progress">
                    <div id="progressText">1 / 50</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 2%"></div>
                    </div>
                </div>
            </div>

            <!-- Quiz Mode -->
            <div id="quizMode" style="display: none;">
                <div class="word-card" onclick="playWordSound()">
                    <div class="word-text" id="quizWordText">the</div>
                    <div class="word-type" id="quizWordType">article</div>
                </div>

                <div class="quiz-options" id="quizOptions">
                    <button class="quiz-option-btn" onclick="checkQuizAnswer(0)">选项1</button>
                    <button class="quiz-option-btn" onclick="checkQuizAnswer(1)">选项2</button>
                    <button class="quiz-option-btn" onclick="checkQuizAnswer(2)">选项3</button>
                    <button class="quiz-option-btn" onclick="checkQuizAnswer(3)">选项4</button>
                </div>

                <div class="quiz-result" id="quizResult"></div>

                <div class="nav-buttons">
                    <button class="nav-btn prev" onclick="prevWord()">⬅️ 上一个</button>
                    <button class="nav-btn next" onclick="nextWord()">下一个 ➡️</button>
                </div>

                <div class="nav-buttons">
                    <button class="nav-btn back" onclick="goToPage1()">⬅️ 返回目录</button>
                </div>

                <div class="progress">
                    <div id="quizProgressText">1 / 50</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="quizProgressFill" style="width: 2%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load word data
        let wordData = {};
        let currentLevel = 1;
        let currentMode = 'learn';
        let currentWords = [];
        let quizWords = [];
        let currentIndex = 0;
        let shuffled = false;
        let isRecording = false;
        let recognition = null;

        // Quiz statistics tracking
        let quizStats = {
            level1: { correct: 0, total: 0 },
            level2: { correct: 0, total: 0 },
            level3: { correct: 0, total: 0 },
            level4: { correct: 0, total: 0 },
            level5: { correct: 0, total: 0 },
            level6: { correct: 0, total: 0 }
        };

        // Vocabulary growth history
        let growthHistory = [];

        // Word learning and review tracking
        let wordReviewData = {};

        // Wrong answer notebook
        let wrongAnswers = [];

        // Load words from JSON file
        async function loadWords() {
            try {
                const response = await fetch('words.json');
                wordData = await response.json();
                currentWords = wordData.level1;
            } catch (error) {
                console.error('Error loading words:', error);
                // Fallback to hardcoded words if file fails to load
                wordData = {
                    level1: [
                        {word: "the", translation: "这/那", example: "The cat is black.", type: "article"},

        // Calculate similarity between two strings
        function calculateSimilarity(str1, str2) {
            const longer = str1.length > str2.length ? str1 : str2;
            const shorter = str1.length > str2.length ? str2 : str1;
            
            if (longer.length === 0) return 1.0;
            
            const costs = [];
            for (let i = 0; i <= longer.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= shorter.length; j++) {
                    if (i === 0) {
                        costs[j] = j;
                    } else if (j > 0) {
                        let newValue = costs[j - 1];
                        if (longer.charAt(i - 1) !== shorter.charAt(j - 1)) {
                            newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                        }
                        costs[j - 1] = lastValue;
                        lastValue = newValue;
                    }
                }
                if (i > 0) costs[shorter.length] = lastValue;
            }
            
            return 1 - costs[shorter.length] / longer.length;
        }

        // Update word review data based on Ebbinghaus forgetting curve
        function updateWordReview(word, correct) {
            const wordKey = word.toLowerCase();
            const now = Date.now();

            if (!wordReviewData[wordKey]) {
                wordReviewData[wordKey] = {
                    firstLearned: now,
                    lastReviewed: now,
                    reviewCount: 0,
                    interval: 0,
                    nextReview: now
                };
            }

            const data = wordReviewData[wordKey];

            if (correct) {
                data.reviewCount++;
                data.lastReviewed = now;

                // Ebbinghaus intervals: 1, 2, 4, 7, 15, 30 days
                const intervals = [1, 2, 4, 7, 15, 30];
                const intervalIndex = Math.min(data.reviewCount - 1, intervals.length - 1);
                data.interval = intervals[intervalIndex] * 24 * 60 * 60 * 1000; // Convert to milliseconds
                data.nextReview = now + data.interval;
            } else {
                // Reset interval on wrong answer
                data.reviewCount = 0;
                data.interval = 0;
                data.nextReview = now;
            }

            saveWordReviewData();
        }

        // Get words due for review
        function getWordsDueForReview() {
            const now = Date.now();
            const dueWords = [];

            for (const [wordKey, data] of Object.entries(wordReviewData)) {
                if (data.nextReview <= now) {
                    dueWords.push({
                        word: wordKey,
                        ...data
                    });
                }
            }

            // Sort by next review time (oldest first)
            dueWords.sort((a, b) => a.nextReview - b.nextReview);

            return dueWords;
        }

        // Practice a wrong word

                const found = wordData[levelKey].find(w => w.word.toLowerCase() === word.word.toLowerCase());

            if (wordObject) {

                currentMode = 'learn';
                quizWords = [wordObject];
                currentIndex = 0;

                // Close modal
                if (window.currentWrongAnswersModal) {
                    window.currentWrongAnswersModal.remove();
                }

                // Go to page 2
                goToPage2();
            }
        }

        // Remove word from wrong answers
        function removeWrongAnswer(index) {
            wrongAnswers.splice(index, 1);
            saveWrongAnswers();

            // Refresh the modal
            if (window.currentWrongAnswersModal) {
                window.currentWrongAnswersModal.remove();
            }
            showWrongAnswers();
        }

        // Update growth history
        function updateGrowthHistory() {
            const vocabEstimate = calculateVocabEstimate();
            const now = new Date();
            const dateStr = now.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });

            // Check if we already have an entry for today
            const todayEntry = growthHistory.find(entry => entry.date === dateStr);
            if (todayEntry) {
                todayEntry.vocab = vocabEstimate;
            } else {
                growthHistory.push({
                    date: dateStr,
                    vocab: vocabEstimate,
                    timestamp: now.getTime()
                });
            }

            // Keep only last 30 entries
            if (growthHistory.length > 30) {
                growthHistory = growthHistory.slice(-30);
            }

            saveGrowthHistory();
        }

        // Toggle stats display
        function toggleStats() {
            const statsContainer = document.getElementById('statsContainer');
            if (statsContainer.style.display === 'none') {
                statsContainer.style.display = 'block';
                updateStatsDisplay();
                drawGrowthChart();
            } else {
                statsContainer.style.display = 'none';
            }
        }

        // Calculate vocabulary estimate based on quiz accuracy
        function calculateVocabEstimate() {
            let totalWords = 0;
            let masteredWords = 0;

            const levelSizes = {
                level1: 300,
                level2: 400,
                level3: 500,
                level4: 600,
                level5: 600,
                level6: 547
            };

            for (let level = 1; level <= 6; level++) {
                const levelKey = `level${level}`;
                const stats = quizStats[levelKey];
                const levelSize = levelSizes[levelKey];

                if (stats.total > 0) {
                    const accuracy = stats.correct / stats.total;
                    masteredWords += Math.round(levelSize * accuracy);
                }
                totalWords += levelSize;
            }

            return masteredWords;
        }

        // Update stats display
        function updateStatsDisplay() {
            const vocabEstimate = calculateVocabEstimate();
            document.getElementById('vocabEstimate').textContent = vocabEstimate;

            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = '';

            const levelSizes = {
                level1: 300,
                level2: 400,
                level3: 500,
                level4: 600,
                level5: 600,
                level6: 547
            };

            for (let level = 1; level <= 6; level++) {
                const levelKey = `level${level}`;
                const stats = quizStats[levelKey];
                const levelSize = levelSizes[levelKey];

                let accuracy = 0;
                let accuracyClass = 'low';
                let accuracyText = '0%';

                if (stats.total > 0) {
                    accuracy = (stats.correct / stats.total) * 100;
                    accuracyText = `${Math.round(accuracy)}%`;

                    if (accuracy >= 80) {
                        accuracyClass = 'high';
                    } else if (accuracy >= 60) {
                        accuracyClass = 'medium';
                    }
                }

                const statItem = document.createElement('div');
                statItem.className = 'stat-item';
                statItem.innerHTML = `
                    <div class="stat-level">Level ${level}</div>
                    <div class="stat-accuracy ${accuracyClass}">${accuracyText}</div>
                    <div class="stat-words">${stats.total} 题 · ${levelSize} 词</div>
                `;
                statsGrid.appendChild(statItem);
            }
        }

        // Draw growth chart
        function drawGrowthChart() {
            const canvas = document.getElementById('growthChart');
            const ctx = canvas.getContext('2d');

            // Set canvas size
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            ctx.scale(2, 2);

            const width = rect.width;
            const height = rect.height;
            const padding = 40;
            const chartWidth = width - padding * 2;
            const chartHeight = height - padding * 2;

            // Clear canvas
            ctx.clearRect(0, 0, width, height);

            // If no data, show message
            if (growthHistory.length < 2) {
                ctx.fillStyle = '#777777';
                ctx.font = '14px Nunito, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('完成更多测试后显示增长曲线', width / 2, height / 2);
                return;
            }

            // Find min and max values
            const vocabValues = growthHistory.map(entry => entry.vocab);
            const minVocab = Math.min(...vocabValues, 0);
            const maxVocab = Math.max(...vocabValues, 100);
            const vocabRange = maxVocab - minVocab || 100;

            // Draw grid lines
            ctx.strokeStyle = '#E5E5E5';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const y = padding + (chartHeight / 4) * i;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(width - padding, y);
                ctx.stroke();

                // Y-axis labels
                const value = Math.round(maxVocab - (vocabRange / 4) * i);
                ctx.fillStyle = '#777777';
                ctx.font = '12px Nunito, sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(value, padding - 5, y + 4);
            }

            // Draw the line
            ctx.strokeStyle = '#1CB0F6';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();

            growthHistory.forEach((entry, index) => {
                const x = padding + (chartWidth / (growthHistory.length - 1)) * index;
                const y = padding + chartHeight - ((entry.vocab - minVocab) / vocabRange) * chartHeight;

                if (index === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });

            ctx.stroke();

            // Draw gradient fill under the line
            const gradient = ctx.createLinearGradient(0, padding, 0, height - padding);
            gradient.addColorStop(0, 'rgba(28, 176, 246, 0.3)');
            gradient.addColorStop(1, 'rgba(28, 176, 246, 0.05)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(padding, height - padding);

            growthHistory.forEach((entry, index) => {
                const x = padding + (chartWidth / (growthHistory.length - 1)) * index;
                const y = padding + chartHeight - ((entry.vocab - minVocab) / vocabRange) * chartHeight;
                ctx.lineTo(x, y);
            });

            ctx.lineTo(width - padding, height - padding);
            ctx.closePath();
            ctx.fill();

            // Draw data points
            growthHistory.forEach((entry, index) => {
                const x = padding + (chartWidth / (growthHistory.length - 1)) * index;
                const y = padding + chartHeight - ((entry.vocab - minVocab) / vocabRange) * chartHeight;

                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#FFFFFF';
                ctx.fill();
                ctx.strokeStyle = '#1CB0F6';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Show date for first and last points
                if (index === 0 || index === growthHistory.length - 1) {
                    ctx.fillStyle = '#777777';
                    ctx.font = '11px Nunito, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(entry.date, x, height - padding + 20);
                }
            });
        }

        // Initialize
        loadWords();

        // Check for due words after loading
        setTimeout(checkDueWords, 1000);
        
        // Load voices when available
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

            ];

            const container = document.getElementById('emojiDecoration');
            const usedEmojis = new Set();
            const emojisPerSide = 4;
            const totalEmojis = emojisPerSide * 4;

            for (let i = 0; i < totalEmojis; i++) {
                let emoji;
                do {
                    emoji = emojis[Math.floor(Math.random() * emojis.length)];
                } while (usedEmojis.has(emoji));
                usedEmojis.add(emoji);

                const emojiItem = document.createElement('div');
                emojiItem.className = 'emoji-item';
                emojiItem.textContent = emoji;

                // Random rotation between -25 and 25 degrees
                const rotation = (Math.random() - 0.5) * 50;
                emojiItem.style.setProperty('--rotation', `${rotation}deg`);

                // Random animation delay for twinkling effect
                const delay = Math.random() * 3;
                emojiItem.style.animationDelay = `${delay}s`;

                // Determine which side and position
                const sideIndex = Math.floor(i / emojisPerSide); // 0: top, 1: right, 2: bottom, 3: left
                const positionInSide = i % emojisPerSide; // 0, 1, 2, 3

                switch (sideIndex) {
                    case 0: // top - along top edge inside container
                        emojiItem.style.top = '5px';
                        emojiItem.style.left = `${12 + positionInSide * 22}%`;
                        break;
                    case 1: // right - along right edge inside container
                        emojiItem.style.right = '5px';
                        emojiItem.style.top = `${15 + positionInSide * 22}%`;
                        break;
                    case 2: // bottom - along bottom edge inside container
                        emojiItem.style.bottom = '5px';
                        emojiItem.style.left = `${12 + positionInSide * 22}%`;
                        break;
                    case 3: // left - along left edge inside container
                        emojiItem.style.left = '5px';
                        emojiItem.style.top = `${15 + positionInSide * 22}%`;
                        break;
                }

                container.appendChild(emojiItem);
            }
        }

        // Generate emojis on load
        window.addEventListener('load', generateEmojiDecoration);
